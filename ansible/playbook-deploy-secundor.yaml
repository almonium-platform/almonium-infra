- name: Deploy Secundor sync server
  hosts: almonium
  gather_facts: false

  vars:
    # deploy_environment, deploy_image_tag, deploy_gh_actor, deploy_gh_token come from CI.
    infra_root: "/home/almonium/infra"
    project_name_base: "secundor"
    app_internal_port: "8080"

  pre_tasks:
    - name: Validate deploy environment
      ansible.builtin.assert:
        that:
          - deploy_environment == "prod"
        fail_msg: "secundor only supports the prod environment"

    - name: Load Secundor app vars
      ansible.builtin.include_vars:
        name: secundor
        file: "{{ playbook_dir }}/vars/apps/secundor/vars.yaml"

    - name: Load Secundor prod secrets
      ansible.builtin.include_vars:
        name: secundor_env
        file: "{{ playbook_dir }}/vars/apps/secundor/vault.prod.yaml"

    - name: Select deployment config
      ansible.builtin.set_fact:
        app_cfg: "{{ secundor.deployments[deploy_environment] }}"

  tasks:
    - name: Determine color file path
      ansible.builtin.set_fact:
        color_file_path: "{{ infra_root }}/.next_color_{{ deploy_environment }}_secundor"
        docker_compose_project_name: "{{ project_name_base }}_{{ deploy_environment }}"

    - name: Read current color for the environment
      ansible.builtin.slurp:
        src: "{{ color_file_path }}"
      register: color_file_content
      failed_when: false

    # Before the rename the app ran as eonkeep_<env>_<slot>. The first Secundor deploy
    # continues that color sequence so it starts on the port slot the old one left free.
    - name: Read the pre-rename color
      ansible.builtin.slurp:
        src: "{{ infra_root }}/.next_color_{{ deploy_environment }}_eonkeep"
      register: legacy_color_file_content
      failed_when: false
      when: color_file_content.content is not defined

    - name: Continue from the pre-rename color
      ansible.builtin.set_fact:
        color_file_content: "{{ legacy_color_file_content }}"
      when: legacy_color_file_content.content is defined

    - name: Choose target and previous slots
      ansible.builtin.set_fact:
        deploy_slot: >-
          {{ 'green' if (color_file_content.content is defined
                         and (color_file_content.content | b64decode) == 'green') else 'blue' }}

    - name: Set previous slot and local healthcheck port
      ansible.builtin.set_fact:
        previous_slot: "{{ 'green' if deploy_slot == 'blue' else 'blue' }}"
        local_healthcheck_port: "{{ '8891' if deploy_slot == 'blue' else '8892' }}"

    - name: Log in to GitHub Container Registry
      community.docker.docker_login:
        registry: ghcr.io
        username: "{{ deploy_gh_actor }}"
        password: "{{ deploy_gh_token }}"

    - name: Deploy target slot
      ansible.builtin.import_role:
        name: deploy_secundor_slot

    - name: Stop and remove previous slot
      ansible.builtin.command: >-
        docker rm -f secundor_{{ deploy_environment }}_{{ previous_slot }}
      register: stop_previous_result
      changed_when: stop_previous_result.rc == 0
      failed_when: false

    - name: Remove containers from before the rename
      ansible.builtin.command: >-
        docker rm -f eonkeep_{{ deploy_environment }}_blue eonkeep_{{ deploy_environment }}_green
      register: stop_legacy_result
      changed_when: "'eonkeep_' in stop_legacy_result.stdout"
      failed_when: false

    - name: Update color file to point to next slot
      ansible.builtin.copy:
        content: "{{ previous_slot }}"
        dest: "{{ color_file_path }}"
        mode: "0644"
      become: true

    - name: Deployment summary
      ansible.builtin.debug:
        msg: "Secundor {{ deploy_environment }} switched to {{ deploy_slot }} on {{ app_cfg.hostname }}"
