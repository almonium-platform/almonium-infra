# Publishes Secundor desktop builds to secundor.almonium.com/downloads. Invoked by the
# Secundor repository's release workflow with release_src pointing at a local folder
# that holds the bundles, latest.json and (for the in-app updater) update.json.
- name: Publish Secundor desktop release
  hosts: almonium
  gather_facts: false

  pre_tasks:
    - name: Load Secundor app vars
      ansible.builtin.include_vars:
        name: secundor
        file: "{{ playbook_dir }}/vars/apps/secundor/vars.yaml"

    - name: Require a release folder
      ansible.builtin.assert:
        that:
          - release_src is defined
          - (release_src ~ '/latest.json') is file
        fail_msg: "release_src must be a local folder containing latest.json"

  tasks:
    - name: Ensure the downloads directory exists
      ansible.builtin.file:
        path: "{{ secundor.shared.downloads_dir }}"
        state: directory
        mode: "0755"

    - name: Upload bundles
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ secundor.shared.downloads_dir }}/"
        mode: "0644"
      loop: "{{ query('fileglob', release_src ~ '/*.deb') + query('fileglob', release_src ~ '/*.AppImage') + query('fileglob', release_src ~ '/*.dmg') + query('fileglob', release_src ~ '/*.app.tar.gz') }}"

    # Written last so the site never links to a file that isn't there yet.
    - name: Publish the manifest
      ansible.builtin.copy:
        src: "{{ release_src }}/latest.json"
        dest: "{{ secundor.shared.downloads_dir }}/latest.json"
        mode: "0644"

    # The in-app updater's feed: signed per bundle, so it only names uploaded files.
    - name: Publish the update feed
      ansible.builtin.copy:
        src: "{{ release_src }}/update.json"
        dest: "{{ secundor.shared.downloads_dir }}/update.json"
        mode: "0644"
      when: (release_src ~ '/update.json') is file

    - name: Find published bundles
      ansible.builtin.find:
        paths: "{{ secundor.shared.downloads_dir }}"
        patterns: ["*.deb", "*.AppImage", "*.dmg", "*.app.tar.gz"]
      register: bundles

    # Up to four bundles per release: deb, AppImage, dmg and the macOS update archive.
    - name: Keep only the newest releases
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ (bundles.files | sort(attribute='mtime', reverse=true))[secundor.shared.keep_releases * 4:] }}"
      loop_control:
        label: "{{ item.path | basename }}"
