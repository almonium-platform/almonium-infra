shared:
  internal_port: "8000"
  embedding_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"

deployments:
  prod:
    hostname: "books.almonium.com"
    almonium_api_url: "https://api.almonium.com/api/v1"
    # Production is the end of the line: nothing is promoted out of it.
    promotion_targets: []
    media_root: "/home/almonium/books/prod/media"
    model_cache_root: "/home/almonium/books/prod/models"
    db:
      name: "almonium_books"
      username: "almonium_books_prod"
    # The backend's database of the same environment, read through the reader
    # role the DB stack creates (postgres_reader_grants); only its lexicon schema.
    lexicon_db:
      name: "almonium"
      username: "almonium_books_lexicon_prod"
    rabbitmq:
      username: "almonium_books_prod"
      vhost: "/almonium_books_prod"

  staging:
    hostname: "staging.books.almonium.com"
    almonium_api_url: "https://staging.api.almonium.com/api/v1"
    # Reviewed editions reach production only through staging.
    promotion_targets: ["prod"]
    media_root: "/home/almonium/books/staging/media"
    model_cache_root: "/home/almonium/books/staging/models"
    db:
      name: "almonium_books_staging"
      username: "almonium_books_staging"
    lexicon_db:
      name: "almonium_staging"
      username: "almonium_books_lexicon_staging"
    rabbitmq:
      username: "almonium_books_staging"
      vhost: "/almonium_books_staging"
