shared:
  local_port: "8080"
  debug_port: "5005"
  context_path: "/api/v1"
  # Cloudflare R2, S3-compatible. One bucket for prod and staging; see the shared vault schema.
  audio:
    s3:
      endpoint: "https://7e8858e7beb85c9f56d28869d65610eb.r2.cloudflarestorage.com"
      region: "auto"
      bucket: "almonium-audio"

deployments:
  prod:
    api_hostname: "api.almonium.com"
    deploy_environment: "prod"
    spring_profile: "prod"
    paddle_environment: "LIVE"
    books_processor_url: "https://books.almonium.com/api/v1"

    db:
      name: "almonium"
      username: "almonium_prod"
      schema: "public"

    rabbitmq:
      username: "almonium_prod"
      vhost: "/almonium_prod"

  staging:
    api_hostname: "staging.api.almonium.com"
    deploy_environment: "staging"
    spring_profile: "staging"
    paddle_environment: "SANDBOX"
    books_processor_url: "https://staging.books.almonium.com/api/v1"

    db:
      name: "almonium_staging"
      username: "almonium_staging"
      schema: "public"

    rabbitmq:
      username: "almonium_staging"
      vhost: "/almonium_staging"
