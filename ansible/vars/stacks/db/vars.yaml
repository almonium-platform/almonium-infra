db_admin_user: "postgres"

db_backup_defaults:
  b2:
    bucket: "oci-db-backup"
    prefix: "almonium-postgres"
  schedule: "*-*-* 03:15:00"
  retention:
    keep_daily: 7
    keep_weekly: 4
    keep_monthly: 3

postgres_app_tenants:
  - app_id: "almonium"
    environment: "prod"
    db_name: "almonium"
    db_user: "almonium_prod"
    db_schema: "public"
    backup: true

  - app_id: "almonium"
    environment: "staging"
    db_name: "almonium_staging"
    db_user: "almonium_staging"
    db_schema: "public"
    backup: true

  - app_id: "fam_sub"
    environment: "prod"
    db_name: "fam_sub"
    db_user: "fam_sub_user"
    db_schema: "public"
    backup: true

  - app_id: "secundor"
    environment: "prod"
    db_name: "secundor"
    db_user: "secundor_prod"
    db_schema: "public"
    backup: true

  - app_id: "almonium_books"
    environment: "prod"
    db_name: "almonium_books"
    db_user: "almonium_books_prod"
    db_schema: "public"
    backup: true

  - app_id: "almonium_books"
    environment: "staging"
    db_name: "almonium_books_staging"
    db_user: "almonium_books_staging"
    db_schema: "public"
    backup: false

# Read-only roles into one schema of another tenant's database. The Books
# processor resolves lexeme and sense ids in bulk against the backend's
# `lexicon` schema at ingest; it may read that schema and nothing else. These
# are not tenants: no database of their own, no ownership, no backup. The
# schema is created here, owned by the tenant whose Liquibase run fills it, so
# the grants hold before the backend's first migration. The password lives in
# the DB vault under postgres_reader_passwords["<reader_id>:<environment>"].
postgres_reader_grants:
  - reader_id: "almonium_books_lexicon"
    environment: "prod"
    reader_role: "almonium_books_lexicon_prod"
    db_name: "almonium"
    db_schema: "lexicon"
    schema_owner: "almonium_prod"

  - reader_id: "almonium_books_lexicon"
    environment: "staging"
    reader_role: "almonium_books_lexicon_staging"
    db_name: "almonium_staging"
    db_schema: "lexicon"
    schema_owner: "almonium_staging"

# Login for Alloy's Postgres collector (monitoring stack). It holds pg_monitor,
# which reads server statistics and database sizes but no table data, and it
# connects only to the maintenance database `postgres`. The password lives in
# the DB vault as postgres_monitoring_password and, with the same value, in the
# monitoring vault as monitoring_postgres_password.
postgres_monitoring_role: "monitoring"
