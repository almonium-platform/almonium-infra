- name: Deploy Almonium BE application
  hosts: almonium
  gather_facts: false

  vars:
    # All --extra-vars from GitHub Actions are available here
    infra_root: "/home/almonium/infra"
    project_name_base: "almonium-be"
    app_internal_port: "8080"

  pre_tasks:
    - name: Load Almonium app vars
      ansible.builtin.include_vars:
        name: almonium
        file: "{{ playbook_dir }}/vars/apps/almonium/vars.yaml"

    - name: Load Almonium shared secrets
      ansible.builtin.include_vars:
        name: almonium_shared
        file: "{{ playbook_dir }}/vars/apps/almonium/vault.shared.yaml"

    - name: Load Almonium prod secrets
      ansible.builtin.include_vars:
        name: almonium_env
        file: "{{ playbook_dir }}/vars/apps/almonium/vault.prod.yaml"
      when: deploy_environment == "prod"

    - name: Load Almonium staging secrets
      ansible.builtin.include_vars:
        name: almonium_env
        file: "{{ playbook_dir }}/vars/apps/almonium/vault.staging.yaml"
      when: deploy_environment == "staging"

    - name: Validate deploy environment
      ansible.builtin.assert:
        that:
          - deploy_environment in ["prod", "staging"]
        fail_msg: "deploy_environment must be prod or staging"

    - name: Validate backend image coordinate
      ansible.builtin.assert:
        that:
          - (deploy_image_digest | default('')) is match('^sha256:[0-9a-f]{64}$')
        fail_msg: >-
          deploy_image_digest must have the form sha256:<64 lowercase hex
          characters

    - name: Select backend image reference
      ansible.builtin.set_fact:
        deploy_image_reference: "ghcr.io/almonium-platform/almonium-be@{{ deploy_image_digest }}"

    - name: Select deployment config
      ansible.builtin.set_fact:
        app_cfg: "{{ almonium.deployments[deploy_environment] }}"

    - name: Validate Books publication secret
      ansible.builtin.assert:
        that:
          - almonium_shared.books.publisher_secret | string | length >= 32
        fail_msg: "Almonium Books publication secret is incomplete."

  tasks:
    - name: Determine project name suffix and color file path
      ansible.builtin.set_fact:
        project_name_suffix: "_{{ deploy_environment }}"
        color_file_path: "{{ infra_root }}/.next_color_{{ deploy_environment }}"

    - name: Read current color for the environment
      ansible.builtin.slurp:
        src: "{{ color_file_path }}"
      register: color_file_content
      failed_when: false

    - name: Determine initial color based on file content
      ansible.builtin.set_fact:
        _color_from_file: >-
          {{ color_file_content.content | b64decode
             if color_file_content.content is defined and color_file_content.content != ""
             else 'blue' }}

    - name: Set target deploy_slot
      ansible.builtin.set_fact:
        deploy_slot: "{{ 'green' if _color_from_file == 'green' else 'blue' }}"

    - name: Set previous_slot based on determined deploy_slot
      ansible.builtin.set_fact:
        previous_slot: "{{ 'green' if deploy_slot == 'blue' else 'blue' }}"

    - name: Set local healthcheck port for target deploy_slot
      ansible.builtin.set_fact:
        local_healthcheck_port: >-
          {%- if deploy_environment == 'staging' -%}
            {{- '9978' if deploy_slot == 'blue' else '9979' -}}
          {%- else -%}
            {{- '9988' if deploy_slot == 'blue' else '9989' -}}
          {%- endif -%}

    - name: Set Docker Compose project name base for environment
      ansible.builtin.set_fact:
        docker_compose_project_name: "{{ project_name_base }}{{ project_name_suffix }}"

    - name: Log in to GitHub Container Registry
      community.docker.docker_login:
        registry: ghcr.io
        username: "{{ deploy_gh_actor }}"
        password: "{{ deploy_gh_token }}"

    - name: Deploy target slot
      ansible.builtin.import_role:
        name: deploy_almonium_be_slot

    - name: Ensure Traefik dynamic configuration directory exists
      ansible.builtin.file:
        path: /home/almonium/traefik_dynamic
        state: directory
        mode: "0755"
      become: true

    - name: Inspect previous slot
      community.docker.docker_container_info:
        name: "almonium_{{ deploy_environment }}_{{ previous_slot }}"
      register: previous_slot_info

    - name: Switch public traffic and verify the selected slot
      block:
        - name: Point the public router at the target slot
          ansible.builtin.template:
            src: "{{ playbook_dir }}/roles/deploy_almonium_be_slot/templates/route.yaml.j2"
            dest: "/home/almonium/traefik_dynamic/almonium-be-{{ deploy_environment }}.yaml"
            mode: "0644"
          vars:
            route_slot: "{{ deploy_slot }}"
          become: true

        - name: Verify HTTPS routes to the target slot
          ansible.builtin.uri:
            url: "https://{{ app_cfg.api_hostname }}{{ almonium.shared.context_path }}/actuator/health"
            method: GET
            return_content: true
            validate_certs: true
          register: routed_health_check
          until:
            - routed_health_check.status == 200
            - routed_health_check.json is defined
            - routed_health_check.json.status == "UP"
            - routed_health_check.x_almonium_deploy_slot | default('') == deploy_slot
          retries: 20
          delay: 3
          delegate_to: localhost

      rescue:
        - name: Restore the previous public route
          ansible.builtin.template:
            src: "{{ playbook_dir }}/roles/deploy_almonium_be_slot/templates/route.yaml.j2"
            dest: "/home/almonium/traefik_dynamic/almonium-be-{{ deploy_environment }}.yaml"
            mode: "0644"
          vars:
            route_slot: "{{ previous_slot }}"
          become: true
          when: previous_slot_info.exists

        - name: Fail deployment after route verification failure
          ansible.builtin.fail:
            msg: >-
              HTTPS smoke test did not confirm that
              {{ app_cfg.api_hostname }} routed to {{ deploy_slot }}.
              The previous route was restored when an earlier slot existed.

    - name: Stop and remove previous slot
      community.docker.docker_container:
        name: "almonium_{{ deploy_environment }}_{{ previous_slot }}"
        state: absent
      when: previous_slot is defined and previous_slot != '' and previous_slot != deploy_slot

    - name: Update color file to point to next slot
      ansible.builtin.copy:
        content: "{{ 'green' if deploy_slot == 'blue' else 'blue' }}"
        dest: "{{ color_file_path }}"
        mode: "0644"
      become: yes

    - name: Deployment summary
      ansible.builtin.debug:
        msg: "✅ Deploy for {{ deploy_environment }} switched to {{ deploy_slot }} on {{ app_cfg.api_hostname }}"
