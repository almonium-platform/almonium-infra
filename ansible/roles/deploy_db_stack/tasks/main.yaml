- name: Load DB stack vars
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/vars/stacks/db/vars.yaml"

- name: Load DB stack secrets
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/vars/stacks/db/vault.yaml"

- name: Combine public and encrypted backup configuration
  ansible.builtin.set_fact:
    db_backup_config: "{{ db_backup_defaults | combine(db_backup, recursive=True) }}"
  no_log: true

- name: Ensure host backup dir exists
  ansible.builtin.file:
    path: /opt/db/backups
    state: directory
    mode: "0700"

- name: Install restic
  ansible.builtin.package:
    name: restic
    state: present

- name: Ensure Docker is installed
  ansible.builtin.shell: |
    if ! command -v docker >/dev/null 2>&1; then
      curl -fsSL https://get.docker.com | sh
    fi
  args:
    executable: /bin/bash
  changed_when: false

- name: Ensure docker compose plugin is installed
  ansible.builtin.package:
    name: docker-compose-plugin
    state: present

- name: Ensure Docker service is running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Validate PostgreSQL tenant declarations exist
  assert:
    that:
      - postgres_app_tenants is defined
      - postgres_app_tenants | length > 0
      - postgres_tenant_passwords is defined
    fail_msg: "postgres_app_tenants and postgres_tenant_passwords must be defined."

- name: Validate PostgreSQL tenant declaration fields
  assert:
    that:
      - item.app_id is defined
      - item.environment is defined
      - item.db_name is defined
      - item.db_name is match('^[A-Za-z0-9_]+$')
      - item.db_user is defined
      - (postgres_tenant_passwords[item.app_id ~ ':' ~ item.environment]) is defined
      - (postgres_tenant_passwords[item.app_id ~ ':' ~ item.environment] | string | length) > 0
    fail_msg: "Invalid postgres tenant declaration: {{ item | to_nice_json }}"
  loop: "{{ postgres_app_tenants }}"
  loop_control:
    label: "{{ item.app_id }}:{{ item.environment }}"

- name: Validate PostgreSQL reader grant declarations
  assert:
    that:
      - item.reader_id is defined
      - item.environment is defined
      - item.reader_role is defined
      - item.reader_role is match('^[A-Za-z0-9_]+$')
      - item.reader_role not in (postgres_app_tenants | map(attribute='db_user') | list)
      - item.db_name is defined
      - item.db_name in (postgres_app_tenants | map(attribute='db_name') | list)
      - item.db_schema is defined
      - item.db_schema is match('^[A-Za-z0-9_]+$')
      - item.schema_owner is defined
      - item.schema_owner == (postgres_app_tenants | selectattr('db_name', 'equalto', item.db_name) | map(attribute='db_user') | first)
      - (postgres_reader_passwords | default({}))[item.reader_id ~ ':' ~ item.environment] is defined
      - ((postgres_reader_passwords | default({}))[item.reader_id ~ ':' ~ item.environment] | string | length) > 0
    fail_msg: >-
      Invalid postgres reader grant declaration (the reader must not be a tenant, the database
      must be a tenant database whose owner is schema_owner, and the password must exist in
      postgres_reader_passwords): {{ item | to_nice_json }}
  loop: "{{ postgres_reader_grants | default([]) }}"
  loop_control:
    label: "{{ item.reader_id }}:{{ item.environment }}"

- name: Validate PostgreSQL monitoring role declaration
  assert:
    that:
      - postgres_monitoring_role is defined
      - postgres_monitoring_role is match('^[A-Za-z0-9_]+$')
      - postgres_monitoring_role not in (postgres_app_tenants | map(attribute='db_user') | list)
      - postgres_monitoring_password is defined
      - (postgres_monitoring_password | string | length) > 0
    fail_msg: "postgres_monitoring_role must be a non-tenant role and postgres_monitoring_password must be in the DB vault."

- name: Validate B2 backup configuration
  ansible.builtin.assert:
    that:
      - db_backup_config is defined
      - db_backup_config.b2 is defined
      - (db_backup_config.b2.bucket | default('') | length) > 0
      - (db_backup_config.b2.prefix | default('') | length) > 0
      - (db_backup_config.b2.application_key_id | default('') | length) > 0
      - (db_backup_config.b2.application_key | default('') | length) > 0
      - (db_backup_config.restic_password | default('') | length) > 0
      - db_backup_config.retention is defined
    fail_msg: "db_backup B2 credentials, repository password, bucket, prefix, and retention must be configured."

- name: Configure restic backup environment
  ansible.builtin.template:
    src: db-backup.env.j2
    dest: /etc/db-backup.env
    owner: root
    group: root
    mode: "0600"

- name: Install database backup script
  ansible.builtin.template:
    src: db-backup.sh.j2
    dest: /usr/local/sbin/db-backup
    owner: root
    group: root
    mode: "0700"

- name: Install database backup systemd service
  ansible.builtin.template:
    src: db-backup.service.j2
    dest: /etc/systemd/system/db-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install database backup systemd timer
  ansible.builtin.template:
    src: db-backup.timer.j2
    dest: /etc/systemd/system/db-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable database backup timer
  ansible.builtin.systemd:
    name: db-backup.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Check if postgres container exists
  community.docker.docker_container_info:
    name: "postgres"
  register: pg_info
  failed_when: false
  changed_when: false

- name: Create timestamp fact for backups
  set_fact:
    backup_ts: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"

- name: Backup tenant databases
  shell: |
    set -e
    docker exec postgres bash -lc '
      set -e
      DB="{{ item.db_name }}"
      if psql -U {{ db_admin_user | default("postgres") }} -tAc "SELECT 1 FROM pg_database WHERE datname='\''${DB}'\''" | grep -q 1; then
        echo "Dumping ${DB}..."
        pg_dump -U {{ db_admin_user | default("postgres") }} -Fc -d "${DB}" > /backups/${DB}_{{ backup_ts }}.dump
        ls -1t /backups/${DB}_*.dump 2>/dev/null | tail -n +8 | xargs -r rm -f
      fi
    '
  when:
    - pg_info is defined
    - pg_info.exists | default(false)
    - (pg_info.container.State.Running | default(false)) or
      (pg_info.container.State.Status | default('') == 'running')
    - item.backup | default(false)
  args:
    executable: /bin/bash
  changed_when: false
  loop: "{{ postgres_app_tenants }}"
  loop_control:
    label: "{{ item.db_name }}"

- name: Ensure db-net exists
  community.docker.docker_network:
    name: db-net
    internal: false
    state: present

- name: Create DB stack dirs
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/db
    - /opt/db/init

- name: Template DB .env
  template:
    src: env.j2
    dest: /opt/db/.env
    mode: "0600"

- name: Push compose file
  copy:
    src: "{{ playbook_dir }}/../services/postgres/docker-compose.yaml"
    dest: /opt/db/docker-compose.yaml
    mode: "0644"

- name: Up DB stack
  community.docker.docker_compose_v2:
    project_src: /opt/db
    state: present

- name: Wait for Postgres to be ready
  shell: "docker exec postgres pg_isready -U {{ db_admin_user | default('postgres') }}"
  register: pg_ready
  retries: 30
  delay: 2
  until: pg_ready.rc == 0
  changed_when: false

- name: Ensure tenant roles exist and passwords are current
  shell: |
    docker exec postgres psql -U {{ db_admin_user | default('postgres') }} -v ON_ERROR_STOP=1 -c "
    DO \$\$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM pg_roles WHERE rolname='{{ item.db_user }}'
      ) THEN
        EXECUTE format(
          'CREATE ROLE %I LOGIN PASSWORD %L',
          '{{ item.db_user }}',
          '{{ postgres_tenant_passwords[item.app_id ~ ":" ~ item.environment] | replace("'", "''") }}'
        );
      ELSE
        EXECUTE format(
          'ALTER ROLE %I PASSWORD %L',
          '{{ item.db_user }}',
          '{{ postgres_tenant_passwords[item.app_id ~ ":" ~ item.environment] | replace("'", "''") }}'
        );
      END IF;
    END
    \$\$;"
  changed_when: false
  loop: "{{ postgres_app_tenants }}"
  loop_control:
    label: "{{ item.app_id }}:{{ item.environment }}"

- name: Ensure tenant databases exist with correct owner
  shell: |
    docker exec postgres psql -U {{ db_admin_user | default('postgres') }} -v ON_ERROR_STOP=1 -tAc "
    SELECT 1 FROM pg_database WHERE datname='{{ item.db_name }}'
    " | grep -q 1 || docker exec postgres createdb -U {{ db_admin_user | default('postgres') }} -O {{ item.db_user }} {{ item.db_name }}
  changed_when: false
  loop: "{{ postgres_app_tenants }}"
  loop_control:
    label: "{{ item.db_name }}"

- name: Ensure tenant DB ownership and schema privileges
  shell: |
    docker exec postgres psql -U {{ db_admin_user | default('postgres') }} -d {{ item.db_name }} -v ON_ERROR_STOP=1 -c "
      ALTER DATABASE {{ item.db_name }} OWNER TO {{ item.db_user }};
      GRANT USAGE, CREATE ON SCHEMA {{ item.db_schema | default('public') }} TO {{ item.db_user }};
      GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA {{ item.db_schema | default('public') }} TO {{ item.db_user }};
      GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA {{ item.db_schema | default('public') }} TO {{ item.db_user }};
      ALTER DEFAULT PRIVILEGES FOR USER {{ item.db_user }} IN SCHEMA {{ item.db_schema | default('public') }}
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO {{ item.db_user }};
      ALTER DEFAULT PRIVILEGES FOR USER {{ item.db_user }} IN SCHEMA {{ item.db_schema | default('public') }}
        GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO {{ item.db_user }};
    "
  changed_when: false
  loop: "{{ postgres_app_tenants }}"
  loop_control:
    label: "{{ item.app_id }}:{{ item.environment }}"

- name: Enforce tenant DB connect isolation
  shell: |
    docker exec postgres psql -U {{ db_admin_user | default('postgres') }} -v ON_ERROR_STOP=1 -c "
      REVOKE CONNECT, TEMP ON DATABASE {{ item.db_name }} FROM PUBLIC;
      GRANT CONNECT ON DATABASE {{ item.db_name }} TO {{ item.db_user }};
    "
  changed_when: false
  loop: "{{ postgres_app_tenants }}"
  loop_control:
    label: "{{ item.db_name }}"

- name: Ensure reader roles exist and passwords are current
  shell: |
    docker exec postgres psql -U {{ db_admin_user | default('postgres') }} -v ON_ERROR_STOP=1 -c "
    DO \$\$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM pg_roles WHERE rolname='{{ item.reader_role }}'
      ) THEN
        EXECUTE format(
          'CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD %L',
          '{{ item.reader_role }}',
          '{{ postgres_reader_passwords[item.reader_id ~ ":" ~ item.environment] | replace("'", "''") }}'
        );
      ELSE
        EXECUTE format(
          'ALTER ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD %L',
          '{{ item.reader_role }}',
          '{{ postgres_reader_passwords[item.reader_id ~ ":" ~ item.environment] | replace("'", "''") }}'
        );
      END IF;
    END
    \$\$;
    ALTER ROLE {{ item.reader_role }} SET default_transaction_read_only = on;
    ALTER ROLE {{ item.reader_role }} SET search_path = {{ item.db_schema }};
    GRANT CONNECT ON DATABASE {{ item.db_name }} TO {{ item.reader_role }};
    "
  changed_when: false
  loop: "{{ postgres_reader_grants | default([]) }}"
  loop_control:
    label: "{{ item.reader_id }}:{{ item.environment }}"

- name: Ensure reader schemas exist and are readable by their reader
  shell: |
    docker exec postgres psql -U {{ db_admin_user | default('postgres') }} -d {{ item.db_name }} -v ON_ERROR_STOP=1 -c "
      CREATE SCHEMA IF NOT EXISTS {{ item.db_schema }} AUTHORIZATION {{ item.schema_owner }};
      GRANT USAGE ON SCHEMA {{ item.db_schema }} TO {{ item.reader_role }};
      GRANT SELECT ON ALL TABLES IN SCHEMA {{ item.db_schema }} TO {{ item.reader_role }};
      GRANT SELECT ON ALL SEQUENCES IN SCHEMA {{ item.db_schema }} TO {{ item.reader_role }};
      ALTER DEFAULT PRIVILEGES FOR ROLE {{ item.schema_owner }} IN SCHEMA {{ item.db_schema }}
        GRANT SELECT ON TABLES TO {{ item.reader_role }};
      ALTER DEFAULT PRIVILEGES FOR ROLE {{ item.schema_owner }} IN SCHEMA {{ item.db_schema }}
        GRANT SELECT ON SEQUENCES TO {{ item.reader_role }};
    "
  changed_when: false
  loop: "{{ postgres_reader_grants | default([]) }}"
  loop_control:
    label: "{{ item.reader_id }}:{{ item.environment }}"

- name: Ensure the monitoring role exists, holds pg_monitor, and its password is current
  shell: |
    docker exec postgres psql -U {{ db_admin_user | default('postgres') }} -v ON_ERROR_STOP=1 -c "
    DO \$\$
    BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM pg_roles WHERE rolname='{{ postgres_monitoring_role }}'
      ) THEN
        EXECUTE format(
          'CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT PASSWORD %L',
          '{{ postgres_monitoring_role }}',
          '{{ postgres_monitoring_password | replace("'", "''") }}'
        );
      ELSE
        EXECUTE format(
          'ALTER ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT PASSWORD %L',
          '{{ postgres_monitoring_role }}',
          '{{ postgres_monitoring_password | replace("'", "''") }}'
        );
      END IF;
    END
    \$\$;
    GRANT pg_monitor TO {{ postgres_monitoring_role }};
    ALTER ROLE {{ postgres_monitoring_role }} SET default_transaction_read_only = on;
    ALTER ROLE {{ postgres_monitoring_role }} CONNECTION LIMIT 3;
    "
  changed_when: false
  no_log: true
