# Cosmos: private reader for transcribed Q&A episodes, which also transcribes new ones.
# deploy.sh in the cosmos repository copies the source to /home/almonium/cosmos/src and writes
# /home/almonium/cosmos/.env (SECRET_CODE, GROQ_API_KEY); the image is built here from that source.
# Episodes and their Q&A data live in /home/almonium/cosmos/data, the only writable path.
services:
  cosmos:
    build:
      context: /home/almonium/cosmos/src
      args:
        # set by deploy.sh: the cosmos commit being deployed, and the day (refreshes yt-dlp daily)
        REVISION: ${REVISION:-unknown}
        YTDLP_REFRESH: ${YTDLP_REFRESH:-0}
    image: cosmos:local
    pull_policy: build
    container_name: cosmos
    env_file: /home/almonium/cosmos/.env
    volumes:
      - /home/almonium/cosmos/data:/data
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cosmos-router.rule=Host(`cosmos.almonium.com`)"
      - "traefik.http.routers.cosmos-router.entrypoints=websecure"
      - "traefik.http.routers.cosmos-router.tls.certresolver=porkbun"
      - "traefik.http.services.cosmos-svc.loadbalancer.server.port=8000"
    restart: unless-stopped

networks:
  proxy-net:
    external: true
