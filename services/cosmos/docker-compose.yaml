# Cosmos: private reader for the transcribed Q&A episodes. Code and data are copied to
# /home/almonium/cosmos by deploy.sh in the cosmos repository; this file only runs it.
# Access needs the code in SECRET_CODE (from /home/almonium/cosmos/.env, written by that script).
services:
  cosmos:
    image: python:3.12-alpine
    container_name: cosmos
    user: "65534:65534"
    working_dir: /app
    command: ["python", "server.py"]
    env_file: /home/almonium/cosmos/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - READ_ONLY=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - /home/almonium/cosmos/app:/app:ro
    read_only: true
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cosmos-router.rule=Host(`cosmos.almonium.com`)"
      - "traefik.http.routers.cosmos-router.entrypoints=websecure"
      - "traefik.http.routers.cosmos-router.tls.certresolver=porkbun"
      - "traefik.http.services.cosmos-svc.loadbalancer.server.port=8000"
    restart: unless-stopped

networks:
  proxy-net:
    external: true
