# The app is a single page; every path is index.html. Two exceptions serve the book-completion certificate
# (design K) on the app's own domain, both answered by the API: the image a certificate link unfurls into, and the
# bare page a link scraper is handed in place of the app shell, so the unfurl has its title, words and image.
map $host $almonium_api {
    default        api.almonium.com;
    ~^staging\.    staging.api.almonium.com;
}

# A link scraper announces itself; a browser never matches.
map $http_user_agent $almonium_scraper {
    default 0;
    ~*(facebookexternalhit|facebot|twitterbot|linkedinbot|slackbot|slack-imgproxy|telegrambot|whatsapp|discordbot|pinterest|redditbot|mastodon|bluesky|embedly|iframely|skypeuripreview|googlebot|bingbot|applebot) 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, so the API host is looked up per request rather than once at start.
    resolver 127.0.0.11 valid=300s ipv6=off;

    # /read/@{username}/{editionSlug}/og.png: the 1200x630 certificate image.
    location ~ ^/read/@([A-Za-z0-9_]+)/([a-z0-9-]+)/og\.png$ {
        proxy_pass https://$almonium_api/api/v1/public/certificates/$1/$2/og.png;
        proxy_ssl_server_name on;
        proxy_set_header Host $almonium_api;
    }

    # /read/@{username}/{editionSlug}: the app for people, the tag page for scrapers.
    location ~ ^/read/@([A-Za-z0-9_]+)/([a-z0-9-]+)$ {
        if ($almonium_scraper) {
            proxy_pass https://$almonium_api/api/v1/public/certificates/$1/$2/page;
        }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1M;
        add_header Cache-Control "public";
        access_log off;
    }
}
