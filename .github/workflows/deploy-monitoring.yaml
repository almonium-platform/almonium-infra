name: Deploy Monitoring

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ansible/playbook-deploy-monitoring.yaml'
      - 'ansible/roles/deploy_monitoring/**'
      - 'ansible/vars/stacks/monitoring/**'
      - '.github/workflows/deploy-monitoring.yaml'

jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run Ansible Playbook
        uses: dawidd6/action-ansible-playbook@3363d6aa333ecb41ef01579bc5eb4412b3d6802f # v5
        with:
          playbook: playbook-deploy-monitoring.yaml
          directory: ansible
          key: ${{ secrets.CLOUD_KEY }}
          known_hosts: ${{ secrets.CLOUD_KNOWN_HOSTS }}
          vault_password: ${{ secrets.ANSIBLE_VAULT_PASSWORD_MONITORING }}
          options: |
            -i inventory/hosts.ini
            --limit almonium
            -e ansible_python_interpreter=/usr/bin/python3
